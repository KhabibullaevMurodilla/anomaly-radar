name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run test suite
        run: python -m pytest tests/ -v

      # The interactive demo (docs/index.html) runs its own JS port of the
      # parser + session detector client-side, so there's no pre-scored
      # data file to keep "in sync" with the Python pipeline anymore. This
      # check instead guards against the one way the two copies actually
      # drift: someone editing ot-radar.html and forgetting to copy it to
      # docs/ (or the reverse) before merging.
      - name: Check docs/index.html matches ot-radar.html
        run: diff ot-radar.html docs/index.html
